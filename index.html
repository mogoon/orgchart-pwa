<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GroovePlay 조직도</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="조직도">
<meta name="mobile-web-app-capable" content="yes">
<!-- 폰트 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin="anonymous"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme:light dark;
    --page:#e8eaee; --app:#f2f4f6; --surface:#ffffff; --field:#f2f4f6;
    --text:#191f28; --sub:#6b7684; --sub2:#adb5bd; --line:#eef0f3;
    --accent:#3b5bff; --accent2:#7a4bff; --accent-soft:#e9edff;
    --ok:#0e8a6f; --ok-soft:#e3f4ee; --danger:#f04452; --danger-soft:#fdebee;
    --hi:#ffe88a; --press:#eceef2; --top:rgba(242,244,246,.86);
    --shadow:0 1px 2px rgba(25,31,40,.05),0 4px 14px rgba(25,31,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#08090b; --app:#101014; --surface:#1a1b20; --field:#25262d;
      --text:#eceef1; --sub:#9099a5; --sub2:#565b64; --line:#26272e;
      --accent:#6b87ff; --accent2:#9a74ff; --accent-soft:rgba(107,135,255,.16);
      --ok:#34c39a; --ok-soft:rgba(52,195,154,.14); --danger:#ff6b7a; --danger-soft:rgba(255,107,122,.15);
      --hi:#5a4d14; --press:#23242b; --top:rgba(16,16,20,.82);
      --shadow:0 1px 2px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    background:var(--page);color:var(--text);display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:440px;min-height:100vh;background:var(--app);display:flex;flex-direction:column}

  /* 공통 SVG 아이콘 */
  .i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

  /* ===== 상단 ===== */
  .top{position:sticky;top:0;z-index:20;background:var(--top);
    -webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);
    padding:calc(14px + env(safe-area-inset-top)) 18px 10px}
  .bar{display:flex;align-items:center;gap:12px}
  .bar .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
    box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
  .bar .ttl b{font-size:18px;font-weight:800;letter-spacing:-.3px}
  .bar .ttl span{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
  .bar .ttl.editable{cursor:pointer}
  .bar .ttl.editable b::after{content:" ✎";font-size:13px;color:var(--sub)}
  .bar .acts{margin-left:auto;display:flex;gap:6px}
  .icobtn{border:none;background:none;cursor:pointer;color:var(--text);
    width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
    transition:background .15s,transform .1s}
  .icobtn .i{width:19px;height:19px}
  .icobtn:active{background:var(--press);transform:scale(.92)}
  .icobtn.on{background:var(--accent);color:#fff}

  .search{position:relative;margin-top:12px}
  .search input{width:100%;padding:12px 38px;border:none;border-radius:999px;
    background:var(--surface);color:var(--text);font-size:14.5px;outline:none;
    box-shadow:var(--shadow);font-family:inherit;transition:box-shadow .15s}
  .search input:focus{box-shadow:var(--shadow),0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
  .search input::placeholder{color:var(--sub2)}
  .search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub)}
  .search .ic .i{width:15px;height:15px}
  .search .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:none;background:var(--press);
    color:var(--sub);width:24px;height:24px;border-radius:50%;cursor:pointer;display:none;font-size:12px}

  .toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .tbtn{border:none;background:var(--surface);border-radius:999px;padding:8px 13px;
    font-size:12px;cursor:pointer;color:var(--text);font-weight:600;font-family:inherit;
    display:inline-flex;align-items:center;gap:5px;box-shadow:var(--shadow);
    transition:transform .1s}
  .tbtn .i{width:13px;height:13px;color:var(--sub)}
  .tbtn:active{transform:scale(.95);background:var(--press)}

  /* ===== 리스트 ===== */
  .list{padding:2px 0 calc(80px + env(safe-area-inset-bottom));flex:1}

  /* 부서 = 카드 */
  .dept{margin:10px 14px 0;background:var(--surface);border-radius:20px;overflow:hidden;
    box-shadow:var(--shadow)}
  .dept-head{display:flex;align-items:center;gap:8px;padding:15px 16px;cursor:pointer;user-select:none}
  .dept-head:active{background:var(--press)}
  .dept-head .dname{font-size:14px;color:var(--text);font-weight:700;letter-spacing:-.2px}
  .dept-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .dept-head .dcount{font-size:12px;color:var(--sub);background:var(--field);
    padding:2px 9px;border-radius:999px;font-weight:600}
  .dept-head .arw{color:var(--sub2);display:grid;place-items:center;transition:transform .25s}
  .dept-head .arw .i{width:14px;height:14px}
  .dept.open .dept-head .arw{transform:rotate(90deg)}
  .dept-tools{display:flex;gap:3px}

  .members{overflow:hidden;max-height:0;transition:max-height .3s ease}
  .dept.open .members{max-height:9000px;padding:0 0 10px}

  /* 팀 = 소제목 */
  .team-head{display:flex;align-items:center;gap:7px;padding:10px 16px 4px;
    opacity:0;transform:translateY(6px)}
  .dept.open .team-head.show{animation:pop .3s ease forwards}
  .team-head .tline{width:3px;height:11px;border-radius:2px;background:var(--accent);opacity:.6}
  .team-head .tname{font-size:12px;color:var(--sub);font-weight:700}

  /* 인원 행 */
  .m{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:default;
    opacity:0;transform:translateY(6px)}
  .m.in-team{padding-left:24px}
  .dept.open .m.show{animation:pop .3s ease forwards}
  @keyframes pop{to{opacity:1;transform:translateY(0)}}
  .m:active{background:var(--press)}
  /* 드래그(편집 모드, 마우스) */
  .editing .m,.editing .dept-head{cursor:grab}
  .editing .m:active,.editing .dept-head:active{cursor:grabbing}
  .m.dragging,.dept.dragging{opacity:.4}
  .m.dz-before{box-shadow:inset 0 3px 0 var(--accent)}
  .m.dz-after{box-shadow:inset 0 -3px 0 var(--accent)}
  .dept.dz-into{outline:2px dashed var(--accent);outline-offset:-2px}
  .dept.dz-before{box-shadow:0 -4px 0 var(--accent),var(--shadow)}
  .dept.dz-after{box-shadow:0 4px 0 var(--accent),var(--shadow)}
  .m .av{width:46px;height:46px;border-radius:38%;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:15px;background:var(--av);
    background:linear-gradient(140deg,color-mix(in srgb,var(--av) 72%,#fff) 0%,var(--av) 85%)}
  @media (prefers-color-scheme: dark){
    .m .av{background:linear-gradient(140deg,color-mix(in srgb,var(--av) 80%,#fff) 0%,color-mix(in srgb,var(--av) 80%,#000) 100%)}
  }
  .m .info{flex:1;min-width:0}
  .m .r1{display:flex;align-items:baseline;gap:7px}
  .m .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px}
  .m .rk{font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:1.5px 8px;border-radius:999px;font-weight:600}
  .m .duty{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m .tels{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tel{display:inline-flex;align-items:center;gap:4px;font-size:12px;text-decoration:none;
    font-weight:600;padding:4px 10px;border-radius:999px}
  .tel .i{width:11px;height:11px}
  .tel:active{opacity:.6}
  .tel.mob{color:var(--accent);background:var(--accent-soft)}
  .tel.ext{color:var(--ok);background:var(--ok-soft);cursor:default}
  mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}

  /* 편집 컨트롤 */
  .rowtools{display:flex;gap:3px;margin-left:auto}
  .mini{border:none;background:var(--field);border-radius:9px;width:28px;height:28px;
    cursor:pointer;display:grid;place-items:center;color:var(--sub);flex:none;
    transition:transform .1s}
  .mini .i{width:13px;height:13px}
  .mini:active{background:var(--press);transform:scale(.9)}
  .mini.del{color:var(--danger);background:var(--danger-soft)}
  .add-m{padding:8px 12px 4px}
  .add-m button{width:100%;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);
    color:var(--accent);background:none;font-family:inherit;
    border-radius:14px;padding:10px;font-size:12.5px;cursor:pointer;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:5px}
  .add-m button:active{background:var(--accent-soft)}
  .add-m .i{width:12px;height:12px}

  .empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;display:none}
  .empty.show{display:block}

  /* 모달 */
  .mask{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:50;display:none;
    align-items:flex-end;justify-content:center;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .mask.show{display:flex}
  .sheet{width:100%;max-width:440px;background:var(--surface);border-radius:24px 24px 0 0;
    padding:12px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
  .sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;
    background:var(--sub2);opacity:.45;margin:0 auto 16px}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:2px 0 16px;font-size:17px;letter-spacing:-.3px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600}
  .fld input,.fld select,.fld textarea{width:100%;padding:12px 13px;border:none;
    border-radius:13px;font-size:15px;outline:none;font-family:inherit;
    background:var(--field);color:var(--text);transition:box-shadow .15s}
  .fld input:focus,.fld select:focus,.fld textarea:focus{
    box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
  .fld textarea{resize:vertical;min-height:56px}
  .sheet-btns{display:flex;gap:8px;margin-top:10px}
  .sheet-btns button{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:700;
    cursor:pointer;border:none;font-family:inherit;transition:transform .1s}
  .sheet-btns button:active{transform:scale(.97)}
  .b-save{background:var(--accent);color:#fff}
  .b-cancel{background:var(--field);color:var(--text)}
  .b-del{background:var(--danger-soft);color:var(--danger);flex:0 0 auto;padding:14px 18px}

  /* ===== 넓은 화면: 부서 카드 그리드로 재배치 ===== */
  @media (min-width:700px){
    .app{max-width:1200px}
    /* 보기 모드: 부서 카드를 화면 폭에 맞춰 여러 열로 */
    .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
      gap:14px;align-items:start;padding:16px 18px calc(80px + env(safe-area-inset-bottom))}
    .list .dept{margin:0}
    /* 편집 모드: 드래그 순서변경이 직관적이도록 한 줄 유지 */
    .list.editing{display:block;max-width:480px;margin:0 auto}
    .list.editing .dept{margin:12px 0 0}
    /* 모달: 하단 시트 대신 화면 중앙 다이얼로그 */
    .mask{align-items:center}
    .sheet{border-radius:24px;max-height:88vh}
    .sheet::before{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="bar">
      <div class="logo" id="coLogo">G</div>
      <div class="ttl" id="coTitle"><b id="coName">GroovePlay</b><span id="hdrCount"></span></div>
      <div class="acts">
        <button class="icobtn" id="editToggle" title="편집"></button>
      </div>
    </div>
    <div class="search">
      <span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="q" type="text" placeholder="이름 · 핸드폰 · 내선 · 업무 검색" autocomplete="off">
      <button class="clr" id="clr">✕</button>
    </div>
    <div class="toolbar">
      <button class="tbtn" id="addDept" style="display:none"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>부서 추가</button>
      <button class="tbtn" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/></svg>백업(JSON)</button>
      <button class="tbtn" id="importBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3m0 0L7 8m5-5l5 5"/><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/></svg>복원(JSON)</button>
      <button class="tbtn" id="resetBtn" style="display:none"><svg class="i" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 102.1-9.4L1 10"/></svg>초기화</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty">검색 결과가 없어요.</div>
</div>

<!-- 멤버 편집 모달 -->
<div class="mask" id="mMask">
  <div class="sheet">
    <h3 id="mTitle">멤버 추가</h3>
    <div class="fld"><label>부서</label><select id="fDept"></select></div>
    <div class="fld"><label>팀 <span style="color:var(--sub2);font-weight:400">(선택 · 비우면 부서 직속)</span></label><input id="fTeam" placeholder="예: 서버팀" list="teamList"><datalist id="teamList"></datalist></div>
    <div class="fld"><label>이름</label><input id="fName" placeholder="예: 홍길동"></div>
    <div class="fld"><label>직급</label><input id="fRank" placeholder="예: 과장"></div>
    <div class="fld"><label>핸드폰</label><input id="fMobile" placeholder="예: 010-0000-0000" inputmode="tel"></div>
    <div class="fld"><label>내선번호</label><input id="fExt" placeholder="예: 101" inputmode="numeric"></div>
    <div class="fld"><label>담당 업무</label><textarea id="fDuty" placeholder="예: 인사·채용, 근태 관리"></textarea></div>
    <div class="sheet-btns">
      <button class="b-del" id="mDelete" style="display:none">삭제</button>
      <button class="b-cancel" id="mCancel">취소</button>
      <button class="b-save" id="mSave">저장</button>
    </div>
  </div>
</div>

<!-- 부서 편집 모달 -->
<div class="mask" id="dMask">
  <div class="sheet">
    <h3 id="dTitle">부서 추가</h3>
    <div class="fld"><label>부서명</label><input id="dName" placeholder="예: 경영지원실"></div>
    <div class="sheet-btns">
      <button class="b-del" id="dDelete" style="display:none">삭제</button>
      <button class="b-cancel" id="dCancel">취소</button>
      <button class="b-save" id="dSave">저장</button>
    </div>
  </div>
</div>

<script>
// ---------- 기본(초기) 조직 데이터 ----------
const DEFAULT_ORG = [

    {name:"박수민", rank:"과장", team:"인사팀", mobile:"010-0000-0000", ext:"102", duty:"인사·채용, 4대보험, 근태 관리"},
    {name:"이정우", rank:"대리", team:"재무팀", mobile:"010-0000-0000", ext:"103", duty:"회계·세무, 법인카드 정산"},
    {name:"최유나", rank:"주임", team:"총무팀", mobile:"010-0000-0000", ext:"104", duty:"총무, 비품 구매, 사무실 관리"},

  { dept:"개발본부", members:[

    {name:"한지훈", rank:"팀장", team:"클라이언트팀", mobile:"010-0000-0000", ext:"210", duty:"유니티 클라이언트 개발"},
    {name:"오세라", rank:"선임", team:"클라이언트팀", mobile:"010-0000-0000", ext:"211", duty:"게임 UI/UX 구현, 인게임 이펙트"},

    {name:"윤하람", rank:"선임", team:"서버팀", mobile:"010-0000-0000", ext:"221", duty:"백엔드 API, DB 설계, 결제 서버"},
  ]},
  { dept:"기획실", members:[

    {name:"권도윤", rank:"선임", team:"3D팀", mobile:"010-0000-0000", ext:"402", duty:"캐릭터 3D 모델링, 애니메이션"},
    {name:"문가영", rank:"주임", team:"원화팀", mobile:"010-0000-0000", ext:"403", duty:"배경 원화, 인게임 아이콘"},
  ]},
  { dept:"사업실", members:[
    {name:"조현우", rank:"실장", team:"", mobile:"010-0000-0000", ext:"501", duty:"퍼블리싱, 사업 제휴, 계약"},

    {name:"서동욱", rank:"대리", team:"운영팀", mobile:"010-0000-0000", ext:"503", duty:"CS·고객대응, 커뮤니티 관리"},

const NAME_KEY  = "grooveplay_company_v1";

// ---------- 상태 ----------

let COMPANY = loadName();
let editMode = false;
let openState = {};
let mEditRef = null;
let dEditRef = null;

function load(){
  try{

    if(s){
      const v=JSON.parse(s);
      if(Array.isArray(v) && v.every(d=>d && typeof d.dept==='string' && Array.isArray(d.members))) return v;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_ORG));
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(ORG)); }catch(e){
    alert("저장 실패: 브라우저 저장공간을 사용할 수 없습니다.");
  }
}
function loadName(){
  try{ const s=localStorage.getItem(NAME_KEY); if(s) return s; }catch(e){}
  return DEFAULT_NAME;
}
function saveName(){ try{ localStorage.setItem(NAME_KEY, COMPANY); }catch(e){} }
function applyName(){

// ---------- 유틸 ----------
const COLORS = ["#3b5bff","#7a4bff","#e0518a","#f0883e","#2fae72","#0ea5b5","#8b5cf6","#d9455f"];
function colorFor(s){let h=0;for(const c of s)h=c.charCodeAt(0)+((h<<5)-h);return COLORS[Math.abs(h)%COLORS.length];}
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function hl(text,q){ text=text||""; if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

// ---------- 요소 ----------
const list=document.getElementById('list');
const q=document.getElementById('q');
const clr=document.getElementById('clr');
const empty=document.getElementById('empty');

function match(m,query){
  if(!query) return true;
  const t=(m.name+' '+m.rank+' '+(m.team||'')+' '+m.mobile+' '+(m.mobile||'').replace(/-/g,'')+
          ' 내선 '+m.ext+' '+m.duty).toLowerCase();
  return t.includes(query.toLowerCase());
}

function updateCount(){
  const total=ORG.reduce((a,d)=>a+d.members.length,0);
  document.getElementById('hdrCount').textContent=`부서 ${ORG.length} · 임직원 ${total}`;
}

function render(){
  const query=q.value.trim();
  clr.style.display=query?'block':'none';
  updateCount();
  list.innerHTML='';
  let anyResult=false;

  ORG.forEach((d,di)=>{
    const filtered=[];
    d.members.forEach((m,mi)=>{ if(match(m,query)) filtered.push({m,mi}); });
    if(query && filtered.length===0) return;
    anyResult=true;

    const open = editMode ? true : (query ? true : (openState[di]||false));
    const canDrag = editMode && !query;
    const dept=document.createElement('div');
    dept.className='dept'+(open?' open':'');
    dept.dataset.di=di;

    const deptTools = editMode ? `
      <span class="dept-tools" onclick="event.stopPropagation()">
        <button class="mini" onclick="moveDept(${di},-1)" title="위로">${IC.up}</button>
        <button class="mini" onclick="moveDept(${di},1)" title="아래로">${IC.down}</button>
        <button class="mini" onclick="openDeptEdit(${di})" title="부서명 수정">${IC.pen}</button>
        <button class="mini del" onclick="delDept(${di})" title="부서 삭제">${IC.trash}</button>
      </span>` : '';

    dept.innerHTML=`
      <div class="dept-head" data-di="${di}">
        <span class="dname">${esc(d.dept)}</span>
        <span class="right">
          <span class="dcount">${query?filtered.length:d.members.length}</span>
          ${editMode?deptTools:'<span class="arw">'+IC.chev+'</span>'}
        </span>
      </div>
      <div class="members"></div>`;

    if(canDrag) dept.querySelector('.dept-head').draggable=true;

    const mm=dept.querySelector('.members');
    let curTeam=null;
    filtered.forEach((o,idx)=>{
      const m=o.m, mi=o.mi;
      const team=(m.team||'').trim();

      // 팀이 바뀌면 소제목 삽입 (팀명이 있을 때만)
      if(team!==curTeam){
        curTeam=team;
        if(team){
          const th=document.createElement('div');
          th.className='team-head';
          if(open){th.classList.add('show');th.style.animationDelay=(idx*45)+'ms';}
          th.innerHTML=`<span class="tline"></span><span class="tname">${hl(team,query)}</span>`;
          mm.appendChild(th);
        }
      }

      const el=document.createElement('div');
      el.className='m'+(team?' in-team':'');
      el.dataset.di=di; el.dataset.mi=mi;
      if(canDrag) el.draggable=true;
      if(open){el.classList.add('show');el.style.animationDelay=(idx*45)+'ms';}

      const rowTools = editMode ? `
        <span class="rowtools">
          <button class="mini" onclick="moveMember(${di},${mi},-1)" title="위로">${IC.up}</button>
          <button class="mini" onclick="moveMember(${di},${mi},1)" title="아래로">${IC.down}</button>
          <button class="mini" onclick="openMemberEdit(${di},${mi})" title="수정">${IC.pen}</button>
        </span>` : '';

      const extChip = m.ext ? `<span class="tel ext">${IC.call} 내선 ${hl(m.ext,query)}</span>` : '';
      const mobChip = m.mobile ? `<a class="tel mob" draggable="false" href="tel:${(m.mobile||'').replace(/[^0-9+]/g,'')}">${IC.phone} ${hl(m.mobile,query)}</a>` : '';

      el.innerHTML=`
        <div class="av" style="--av:${colorFor(m.name||'?')}">${esc((m.name||'?').slice(-2))}</div>
        <div class="info">
          <div class="r1"><span class="nm">${hl(m.name,query)}</span><span class="rk">${hl(m.rank,query)}</span>${rowTools}</div>
          <div class="duty">${hl(m.duty,query)}</div>
          <div class="tels">${mobChip}${extChip}</div>
        </div>`;
      mm.appendChild(el);
    });

    if(editMode){
      const add=document.createElement('div');
      add.className='add-m';
      add.innerHTML=`<button onclick="openMemberAdd(${di})">${IC.plus}${esc(d.dept)}에 인원 추가</button>`;
      mm.appendChild(add);
    }
    list.appendChild(dept);
  });

  empty.className='empty'+(anyResult?'':' show');
}

// ---------- 순서 변경 ----------
function moveDept(di,dir){
  const j=di+dir; if(j<0||j>=ORG.length) return;
  [ORG[di],ORG[j]]=[ORG[j],ORG[di]];
  save(); render();
}
function moveMember(di,mi,dir){
  const arr=ORG[di].members; const j=mi+dir; if(j<0||j>=arr.length) return;
  [arr[mi],arr[j]]=[arr[j],arr[mi]];
  save(); render();
}
function delDept(di){
  if(!confirm(`"${ORG[di].dept}" 부서와 소속 인원을 모두 삭제할까요?`)) return;
  ORG.splice(di,1); save(); render();
}

// ---------- 드래그 앤 드롭 (편집 모드 · 마우스) ----------
let dragCtx=null;
function clearDropHints(){
  list.querySelectorAll('.dz-before,.dz-after,.dz-into')
      .forEach(el=>el.classList.remove('dz-before','dz-after','dz-into'));
}
function cleanupDrag(){
  clearDropHints();
  list.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  dragCtx=null;
}
function isBefore(el,y){ const r=el.getBoundingClientRect(); return y < r.top + r.height/2; }

list.addEventListener('dragstart',e=>{
  if(!editMode || q.value.trim()){ e.preventDefault(); return; }
  const m=e.target.closest('.m');
  if(m){
    dragCtx={type:'member', di:+m.dataset.di, mi:+m.dataset.mi};
    m.classList.add('dragging');
  }else{
    const dh=e.target.closest('.dept-head');
    if(!dh){ e.preventDefault(); return; }
    const d=dh.closest('.dept');
    dragCtx={type:'dept', di:+d.dataset.di};
    d.classList.add('dragging');
  }
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain','');   // Firefox는 데이터가 있어야 드래그 시작
});

list.addEventListener('dragover',e=>{
  if(!dragCtx) return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  clearDropHints();
  if(dragCtx.type==='member'){
    const overM=e.target.closest('.m');
    if(overM){
      overM.classList.add(isBefore(overM,e.clientY)?'dz-before':'dz-after');
    }else{
      const overD=e.target.closest('.dept');
      if(overD) overD.classList.add('dz-into');
    }
  }else{
    const overD=e.target.closest('.dept');
    if(overD && +overD.dataset.di!==dragCtx.di){
      overD.classList.add(isBefore(overD,e.clientY)?'dz-before':'dz-after');
    }
  }
});

list.addEventListener('drop',e=>{
  if(!dragCtx) return;
  e.preventDefault();
  if(dragCtx.type==='member') dropMember(e);
  else dropDept(e);
  cleanupDrag();
});
list.addEventListener('dragend',cleanupDrag);

function dropMember(e){
  const src=dragCtx;
  const rec=ORG[src.di].members[src.mi];
  if(!rec) return;
  let destDi, destIndex;
  const overM=e.target.closest('.m');
  if(overM){
    destDi=+overM.dataset.di;
    const destMi=+overM.dataset.mi;
    destIndex=isBefore(overM,e.clientY)?destMi:destMi+1;
  }else{
    const overD=e.target.closest('.dept');
    if(!overD) return;
    destDi=+overD.dataset.di;
    destIndex=ORG[destDi].members.length;
  }
  ORG[src.di].members.splice(src.mi,1);
  if(destDi===src.di && src.mi<destIndex) destIndex--;   // 같은 부서 내 앞쪽 제거 보정
  ORG[destDi].members.splice(destIndex,0,rec);
  if(destDi!==src.di){
    // 다른 부서로 이동: 팀 그룹끼리 모이도록 정리(수정 모달과 동일 동작)
    ORG[destDi].members=normalizeTeams(ORG[destDi].members);
  }
  save(); render();
}

function dropDept(e){
  const from=dragCtx.di;
  const overD=e.target.closest('.dept');
  if(!overD) return;
  const to=+overD.dataset.di;
  if(to===from) return;
  let insertAt=isBefore(overD,e.clientY)?to:to+1;
  const [d]=ORG.splice(from,1);
  if(from<insertAt) insertAt--;
  ORG.splice(insertAt,0,d);
  save(); render();
}

// 같은 팀끼리 모이도록 부서 내 인원을 팀 첫 등장 순서로 안정 정렬
function normalizeTeams(arr){
  const order=[]; const groups=new Map();
  arr.forEach(m=>{ const t=(m.team||'').trim(); if(!groups.has(t)){groups.set(t,[]);order.push(t);} groups.get(t).push(m); });
  const out=[]; order.forEach(t=>groups.get(t).forEach(m=>out.push(m))); return out;
}
function allTeams(){
  const s=new Set();
  ORG.forEach(d=>d.members.forEach(m=>{ if((m.team||'').trim()) s.add(m.team.trim()); }));
  return [...s];
}

function fileStamp(){

}

// 헤더 이름의 다양한 표기를 허용
function pick(row, keys){
  for(const k of Object.keys(row)){
    const kk=k.replace(/\s/g,'');
    if(keys.some(t=>kk===t)) return row[k];
  }
  return '';
}
function cell(v){ return (v==null?'':String(v)).trim(); }

// 다양한 형태의 JSON을 { org:[{dept,members}], company } 형태로 정규화
function parseBackup(data){
  let company=null, list=null;

  if(Array.isArray(data)){
    // 최상위가 배열: 부서 배열이거나 평면 행 배열
    list=data;
  }else if(data && typeof data==='object'){
    company = data.company || data.회사명 || data.name || null;
    list = data.org || data.조직도 || data.departments || data.rows || data.members || null;
  }
  if(!Array.isArray(list) || !list.length) throw new Error('데이터 없음');

  const map=new Map(); const order=[];
  const addRec=(dept, rec)=>{
    dept = cell(dept) || "미분류";
    if(!rec.name && !rec.mobile && !rec.ext && !rec.duty) return; // 빈 행 skip
    if(!map.has(dept)){ map.set(dept,[]); order.push(dept); }
    map.get(dept).push(rec);
  };
  const toRec=row=>({
    name:   cell(pick(row,["이름","성명","name","성함"])),
    rank:   cell(pick(row,["직급","직책","직위","rank","title"])),
    team:   cell(pick(row,["팀","팀명","team","파트","그룹"])),
    mobile: cell(pick(row,["핸드폰","휴대폰","휴대전화","전화","전화번호","mobile","phone","연락처"])),
    ext:    cell(pick(row,["내선번호","내선","ext","extension"])),
    duty:   cell(pick(row,["담당업무","업무","담당","duty","role","직무"])),
  });

  list.forEach(item=>{
    if(item && Array.isArray(item.members)){
      // 부서 객체 { dept, members:[...] }
      const dept = item.dept || item.부서 || item.department || item.name;
      item.members.forEach(m=>addRec(dept, toRec(m)));
    }else if(item && typeof item==='object'){
      // 평면 행 { 부서, 이름, ... }
      const dept = pick(item,["부서","부서명","department","dept","본부","소속"]);
      addRec(dept, toRec(item));
    }
  });
  if(!order.length) throw new Error('데이터 없음');

  return {
    company,
    org: order.map(d=>({dept:d, members:normalizeTeams(map.get(d))}))
  };
}

importFile.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const {company, org}=parseBackup(data);

      ORG = org;
      if(company){ COMPANY=String(company).trim(); saveName(); applyName(); }

      save(); openState={}; render();
      alert(`복원 완료 · ${ORG.length}개 부서, ${ORG.reduce((a,d)=>a+d.members.length,0)}명`);
    }catch(err){
      alert('JSON 파일을 읽지 못했습니다. 이 앱에서 백업한 JSON 파일인지 확인하세요.');
    }
    importFile.value='';
  };
  r.readAsText(f);
};
resetBtn.onclick=()=>{
  if(!confirm('모든 변경을 지우고 초기 샘플 데이터로 되돌릴까요?')) return;
  ORG=JSON.parse(JSON.stringify(DEFAULT_ORG)); save();
  COMPANY=DEFAULT_NAME; saveName(); applyName();
  openState={}; render();
};

// ---------- 검색 ----------
q.addEventListener('input',render);
clr.addEventListener('click',()=>{q.value='';render();q.focus();});

applyName();
applyEditIcon();
render();

// ---------- PWA: 서비스워커 등록 ----------
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
